[project]
	name = y

[build]
	language = c++20
	system = [cmake]
	flags = -fno-omit-frame-pointer
	optimization = 2
	features = [vcpkg, vs2026, vslinkstatic]

[build.target:y]
	source = src/
	source-exclude = [src/LibExport.cpp]
	include-directories = [src/]
	dependencies = [zlib, glfw, vulkan|gl, glew?, freetype2, unwind?, dl?, bullet?, openal?, ogg?, spirv?, fftw3?, openxr?]

#[build.target:moduley]
#	type = shared-library
#	default = false
#	source = src/
#	include-directories = [src/]
#	dependencies = [zlib, glfw, vulkan|gl, glew?, freetype2, unwind?, dl?, bullet?, openal?, ogg?, spirv?, fftw3?, openxr?]

[install]
	source = [static/*]

